# One command:  docker compose up --build   ->   http://localhost:8080
# PostgreSQL + the app, seeded with invented demo data. The defaults below are for LOCAL use only;
# override any of them in a .env file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: birfikrimvar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-only}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d birfikrimvar"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=birfikrimvar;Username=postgres;Password=${POSTGRES_PASSWORD:-localdev-only}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin-Local-1234}
      Seed__DemoData: ${DEMO_DATA:-true}
      Seed__DemoEmail: demo@birfikrimvar.app
      Seed__DemoPassword: ${DEMO_PASSWORD:-Demo-Pass-2026}
      Seed__ShowDemoHint: "true"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  dbdata:
  uploads:
